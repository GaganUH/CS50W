<!DOCTYPE html>
<html lang="en">

<head>
    <title>Google Image Search</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="nav-links">
        <a href="index.html">Google Search</a>
    </div>

    <div class="search-container">

        <h1 class="google-title">Google Images</h1>

        <form action="https://www.google.com/search">

            <input
                class="search-bar"
                type="text"
                name="q"
            >

            <input
                type="hidden"
                name="udm"
                value="2"
            >

            <div class="buttons">
                <input
                    type="submit"
                    value="Image Search"
                >
            </div>

        </form>

    </div>

</body>
</html>
